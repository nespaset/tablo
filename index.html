      {
        heading: "Часть 1. Кочка",
        body: `
<p>Едет тётя Жуля на своей серой «Гранте», музыку слушает, в навигатор поглядывает. Вдруг — бабах! Машина подлетает, тётя Жуля бьётся головой о потолок, подвеска хрустит, бардачок открывается. Она тормозит, пыль столбцом, глаза по копейке. Смотрит на экран, а навигатор ей спокойным голосом:</p>
<div class="nav-voice">Через триста метров поверните направо. О пропущенной кочке вы сможете оставить отзыв в нашем приложении.</div>
<p>Тётя Жуля, потирая ушибленный лоб, дрожащими пальцами набирает номер:</p>
<div class="dialog">— Алло, Светусик? Помоги мне, зайка! Я тут на серой «Гранте» летела, а этот цифровой сусанин промолчал, что на дороге окоп! Машина подпрыгнула, я чуть люк головой не пробила, а этот робот мне говорит: «Вы ушли с маршрута». Да я с жизни чуть не ушла из-за этой кочки! Приезжай, выручай, мы с «Грантой» обе в шоке!</div>
<div class="dialog">— Ой, Жуль, ну никак не могу, у меня ногти! — заявляет Светусик и бросает трубку.</div>
<p>Тётя Жуля от такой наглости аж дар речи теряет. Включает режим максимальной обиды, вычеркивает Свету из завещания и решает, что сильные женщины с рваным тузом и разбитым бампером справляются сами. Она скрежещет зубами, заводит хромающую «Гранту» и берёт курс на нефтебазу. Навигатор, чувствуя свою вину, робко шепчет:</p>
<div class="nav-voice">Маршрут перестроен. Впереди... цистерна с бензином и ваша утерянная гордость.</div>
`
      },
      {
        heading: "Часть 2. Столб",
        body: `
<p>Хромающая серая «Гранта» на всех парах летит к нефтебазе. Обида на Светусика душит тётю Жулю сильнее, чем дым из-под капота, а рваный туз не даёт спокойно сидеть на кресле. Она свирепо смотрит на дорогу, выжимая из бедной машины последние силы. До заветного забора остаётся пара метров. Тётя Жуля уже видит цель, но тут навигатор, решив подать голос в самый неподходящий момент, радостно объявляет:</p>
<div class="nav-voice">Вы прибыли в пункт назначения!</div>
<p>Жуля отвлекается на экран всего на секунду, чтобы мысленно проклясть этот гаджет, теряет управление и — БАБАХ! Серая «Гранта» на полном ходу влетает прямо в бетонный столб со знаком «Стоп». Капот складывается гармошкой, радиатор шипит, а столб медленно косится, но героически держится. Над нефтебазой повисает гробовая тишина, которую нарушает только тихий, дребезжащий голос из динамика телефона:</p>
<div class="nav-voice">Через триста метров... Ой, то есть, подушка безопасности не сработала.</div>
<p>Тётя Жуля со свистом выбивает ногой заклинившую дверь «Гранты», выходит на свежий воздух в клубы белого пара из радиатора, обходит разбитый передок и встаёт в позу разгневанного греческого бога прямо перед помятым бетонным столбом. Она поднимает кулак к небу и начинает свой эпичный монолог:</p>
<div class="dialog">— Ну что, довезли меня технологии?! Илон Маск недоделанный! Света, чтоб тебе пусто было, предательница! Навигатор, тварь ты беспроводная, чтоб ты всю жизнь спутники ловил и не находил! «Через триста метров поверните направо»... Да я из-за тебя в этот столб вошла, как родная! Бампер в щепки, туз порван, «Гранта» теперь похожа на пожёванную открывашку! И ради чего? Ради этой вонючей нефтебазы?! Да гори оно всё синим пламенем, пешком дойду и лично Светке всё выскажу!</div>
<p>Столб над её головой в этот момент жалобно кренится ещё на пару градусов, а из разбитого салона машины навигатор тихонько пиликает:</p>
<div class="nav-voice">Построить пеший маршрут до адреса «Света-Предательница»? Время в пути — три часа обиды.</div>
`
      },
      {
        heading: "Часть 3. Скандал в салоне",
        body: `
<p>Света от такой наглости багровеет, швыряет на стол свои вещи и ка-а-ак заорёт на весь зал:</p>
<div class="dialog">— Да ты страх потеряла, Жуля?! Ты ворвалась сюда, как чучело с помойки, мазутом мне тут всё измазала, орёшь на меня из-за своего корыта! Навигатор у неё виноват, столб у неё виноват! А голова твоя где была, когда ты на кочки прыгала?! Какая нефтебаза, какая ласточка?! Пошла ты со своей серой «Грантой» и рваным тузом прямиком в пешее эротическое! Назад к своему столбу топай, эвакуатор хренов! Штраф за столб сама платить будешь! Выкатывайся отсюда, пока я полицию не вызвала!</div>
<p>Тётя Жуля от такой мощной ответки аж приседает, ловит ртом воздух, а навигатор в её кармане вдруг оживает и радостно объявляет на весь салон:</p>
<div class="nav-voice">Маршрут «Куда подальше» построен. Время в пути — бесконечность.</div>
<p>Тётя Жуля шмыгает носом, гордо вскидывает подбородок и, сверкая глазами, полными слёз и мазута, разворачивается на каблуках. Она выходит из салона, изо всех сил хлопнув дверью так, что стекло жалобно звякает. Обида жжёт грудь, рваный туз горит синим пламенем, но Жуля не сдаётся. Она решает идти мимо своей разбитой «Гранты», мимо проклятого столба — ещё дальше, вглубь за нефтебазу, навстречу неизвестности. Она бредёт по пыльной грунтовке, вокруг гнутся тополя, а впереди простираются бесконечные поля и глухая промзона. Тут из кармана потрёпанных штанов снова доносится вкрадчивый голос навигатора:</p>
<div class="nav-voice">Через двести метров поверните в неизвестность. Впереди возможны новые кочки и экзистенциальный кризис.</div>
<p>Жуля достаёт телефон, смотрит на экран и твёрдо говорит:</p>
<div class="dialog">— Молчи, скотина. Мы идём искать новую жизнь. Без Светки и без серой «Гранты».</div>
`
      },
      {
        heading: "Часть 4. Дальнобойщик Володя",
        body: `
<p>Идёт тётя Жуля по обочине трассы, пыль из-под ног летит, рваный туз воет от боли, а солнце безжалостно жарит макушку. Вдруг позади раздаётся мощный трубный гул. Огромная, блестящая фура Scania бьёт по тормозам, поднимая целое облако пыли, и останавливается прямо аккурат возле Жули. Пассажирская дверь открывается, и оттуда высовывается добродушный усатый дядька в тельняшке и кепке. Это дальнобойщик Володя.</p>
<div class="dialog">— Здорово, мать! — басит Володя, оглядывая её живописный прикид из мазута и пыли. — Ты откуда такая нарядная? Из плена бежала или с нефтебазы дезертировала? Запрыгивай, подвезу, а то на тебе живого места нет!</div>
<p>Тётя Жуля, кряхтя и придерживая пострадавшие части тела, карабкается в высокую кабину. Салон встречает её запахом солярки, освежителя «ёлочка» и шансона из магнитолы. Она падает на мягкое сиденье, закрывает глаза и выдыхает. Володя протягивает ей бутылку минералки и пирожок с картошкой:</p>
<div class="dialog">— На, подкрепись. Куда путь держим, боевая подруга?</div>
<p>Тут из кармана Жули робко пиликает навигатор:</p>
<div class="nav-voice">Вы пересели в транспортное средство повышенной комфортности. Маршрут перестроен в сторону приключений.</div>
<p>Володя хитро прищуривается, крутит ус и, подмигнув, выдаёт:</p>
<div class="dialog">— Моя юная подруга, я тебя везу, с тебя 1 ночь.</div>
<p>Тётя Жуля от такой наглости сначала застывает с пирожком в руке. В голове у неё мгновенно проносится весь сегодняшний день: кочка, разбитый бампер серой «Гранты», предательница Света со своими ногтями, проклятый бетонный столб, три часа ада пешком по жаре с рваным тузом... Она оценивает мягкое, подрессоренное сиденье фуры, кондиционер, кондитерский запах пирожка и понимает, что сил идти пешком дальше нефтебазы у неё просто нет. Пора включать житейскую мудрость. Жуля тяжело вздыхает, поправляет свои испачканные в мазуте штаны, поворачивается к Володе и говорит:</p>
<div class="dialog">— Ладно, усатый, по рукам! Я согласна. Всё равно деваться мне некуда, да и туз так горит, что я вторую смену на ногах не вынесу. Завози свою шаланду, поехали в мотель! Но учти: за это ты мне завтра помогаешь эвакуировать «Гранту» от столба!</div>
<p>Володя от такой лёгкой победы аж засиял, как новая деталь, покрепче вцепился в руль и с размаху нажал на газ. Фура мощно взревела и помчалась по трассе навстречу ночным приключениям. А навигатор из кармана одобрительно и тихонько прошептал:</p>
<div class="nav-voice">Маршрут «Выгода и романтика» построен. Прибытие в мотель — через двадцать минут. Пожалуйста, приготовьтесь к неожиданным поворотам.</div>
`
      },
      {
        heading: "Часть 5. Санки в закат",
        body: `
<p>Володя своё обещание сдержал и отпердолил тётю Жулю так, что кабина фуры ходила ходуном круче, чем «Гранта» на той злосчастной кочке. Но карма — штука быстрая. Наутро выяснилось, что у Володи обострился лютый цистит: усатый дальнобойщик сидел на кровати мотеля, держался за низ живота, выл белугой и ни про какую эвакуацию машины со столба даже слушать не хотел.</p>
<p>Тётя Жуля, поняв, что её опять жестко кинули, устроила грандиозный скандал. Напоследок она послала Володю вместе с его циститом, фурой и пирожками нахуй, сгребла свои вещи и в ярости выскочила из мотеля.</p>
<p>На дворе, как назло, внезапно повалил дикий снег (в этой истории возможно всё). Жуля огляделась, увидела у забора чьи-то брошенные алюминиевые санки, с разбегу прыгнула на них своим многострадальным рваным тузом и на полной скорости улетела вниз по крутому склону прямо в закат, подальше от дальнобойщиков, Светки и нефтебазы.</p>
<p>Из кармана её куртки, занесённой снегом, в последний раз пискнул навигатор:</p>
<div class="nav-voice">Вы набрали первую космическую скорость. Маршрут «Нахуй на санках» успешно завершён. Счастливого полёта!</div>
<div class="authors">Авторы: Gemini and Lipton</div>

<p>Тётя Надя всю жизнь куковала в глубоком одиночестве. Из-за полного отсутствия мужского внимания у неё развился редкий и крайне агрессивный медицинский недуг — хронический Недотрах. Болезнь пагубно влияла на её кукуху, заставляя совершать безумные вещи. Как-то раз она оседлала свои волшебные алюминиевые санки и на полной скорости ворвалась в студию шоу «Пусть говорят». Растолкав охрану, Надя подбежала к микрофону и на всю страну громогласно заявила:</p>

<p>Студия замерла в шоке, а Надя, не дожидаясь аплодисментов, крутанула полицейский разворот на санках и улетела через крышу обратно домой.</p>
`

/* ================= РЕНДЕР ================= */
const tabsEl = document.getElementById('tabs');
const storiesEl = document.getElementById('stories');

let currentStory = 0;
const pageState = STORIES.map(() => 0);

function renderTabs(){
  tabsEl.innerHTML = '';
  STORIES.forEach((s, i) => {
    const b = document.createElement('button');
    b.textContent = s.title;
    b.className = i === currentStory ? 'active' : '';
    b.addEventListener('click', () => {
      currentStory = i;
      renderTabs();
      renderStories();
      window.scrollTo({top: 0, behavior: 'smooth'});
    });
    tabsEl.appendChild(b);
  });
}

function renderStories(){
  storiesEl.innerHTML = '';
  STORIES.forEach((story, si) => {
    const storyEl = document.createElement('section');
    storyEl.className = 'story' + (si === currentStory ? ' active' : '');

    const pages = story.pages;
    const idx = pageState[si];
    const page = pages[idx];

    const panel = document.createElement('article');
    panel.className = 'panel';
    panel.innerHTML = `
      <h2><span class="num">${String(idx + 1).padStart(2,'0')}</span>${page.heading}</h2>
      ${page.body}
    `;
    storyEl.appendChild(panel);

    const pager = document.createElement('div');
    pager.className = 'pager';
    pager.innerHTML = `
      <button class="prev" ${idx === 0 ? 'disabled' : ''}>← Назад</button>
      <span class="status">${idx + 1} / ${pages.length}</span>
      <button class="next" ${idx === pages.length - 1 ? 'disabled' : ''}>Вперёд →</button>
    `;
    pager.querySelector('.prev').addEventListener('click', () => {
      if (pageState[si] > 0){ pageState[si]--; renderStories(); window.scrollTo({top:0,behavior:'smooth'}); }
    });
    pager.querySelector('.next').addEventListener('click', () => {
      if (pageState[si] < pages.length - 1){ pageState[si]++; renderStories(); window.scrollTo({top:0,behavior:'smooth'}); }
    });
    storyEl.appendChild(pager);

    storiesEl.appendChild(storyEl);
  });
}

renderTabs();
renderStories();
</script>
