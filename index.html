<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Презентации — Ионцев Михаил</title>
<style>
:root{
  --gold:#d4af37; --gold-light:#f5e6a8; --gold-deep:#8a6d1f;
  --ink:#05070b; --text:#c9d1dc; --muted:#7d8798;
  --blue:#4a9eff; --blue-light:#a8d4ff;
  --red:#c0392b; --red-light:#f5a8a8;
  --font-display: Georgia, 'Palatino Linotype', serif;
  --font-body: Georgia, 'Palatino Linotype', serif;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--ink);color:var(--text);font-family:var(--font-body);font-size:18px;}
body{
  display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(ellipse 90% 60% at 50% 100%, #1a1308 0%, transparent 70%),
    radial-gradient(ellipse 70% 50% at 50% 0%, #0a1a2a 0%, transparent 60%),
    linear-gradient(180deg, #05070b 0%, #0b0f16 50%, #05070b 100%);
}
.landing{width:100%;max-width:1100px;padding:6vh 6vw;text-align:center;}
.eyebrow{font-family:var(--font-display);font-style:italic;font-size:.78rem;letter-spacing:.45em;text-transform:uppercase;color:var(--gold);margin-bottom:18px;}
h1{
  font-family:var(--font-display);font-weight:700;font-size:clamp(2rem,5.5vw,4rem);
  text-transform:uppercase;letter-spacing:.06em;line-height:1.05;
  background:linear-gradient(180deg,#fffdf5 0%,#f5e6a8 30%,#d4af37 65%,#8a6d1f 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 22px rgba(212,175,55,.35));margin-bottom:14px;
}
.sub{font-style:italic;color:var(--muted);margin-bottom:50px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-bottom:40px;}
.card{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  padding:46px 30px;text-decoration:none;
  border:1px solid rgba(212,175,55,.2);
  background:linear-gradient(170deg, rgba(28,37,52,.6), rgba(11,15,22,.9));
  clip-path:polygon(18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%, 0 18px);
  transition:all .5s cubic-bezier(.22,1,.36,1);
  position:relative;overflow:hidden;min-height:280px;
}
.card::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(120deg,transparent 35%,rgba(212,175,55,.14) 50%,transparent 65%);
  transform:translateX(-130%);transition:transform .9s cubic-bezier(.7,0,.3,1);
}
.card:hover::after{transform:translateX(130%);}
.card:hover{transform:translateY(-8px);border-color:rgba(212,175,55,.6);box-shadow:0 24px 60px rgba(0,0,0,.7),0 0 40px rgba(212,175,55,.2);}
.icon{width:80px;height:80px;color:var(--gold);filter:drop-shadow(0 0 14px rgba(212,175,55,.5));transition:transform .5s;}
.card:hover .icon{transform:scale(1.1) rotate(-4deg);}
.icon svg{width:100%;height:100%;}
.card.grammar .icon{color:var(--blue-light);filter:drop-shadow(0 0 14px rgba(74,158,255,.5));}
.card.grammar:hover{border-color:rgba(74,158,255,.6);}
.card h2{
  font-family:var(--font-display);font-size:1.15rem;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:#e8dfc8;line-height:1.3;
}
.card.grammar h2{color:var(--blue-light);}
.card.misha h2{color:var(--gold-light);}
.card p{font-size:.92rem;color:var(--muted);font-style:italic;}
.btn{
  display:inline-flex;align-items:center;gap:8px;margin-top:8px;
  padding:10px 26px;background:linear-gradient(135deg,var(--gold-light),var(--gold) 45%,var(--gold-deep));
  color:var(--ink);font-family:var(--font-display);font-size:.72rem;font-weight:700;
  letter-spacing:.22em;text-transform:uppercase;
  clip-path:polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  transition:all .3s;
}
.card:hover .btn{transform:translateY(-2px);}
footer{font-family:var(--font-display);font-size:.72rem;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);}
@media(max-width:820px){
  .grid{grid-template-columns:1fr;}
  .card{min-height:220px;padding:36px 24px;}
}
</style>
</head>
<body>
<div class="landing">
  <div class="eyebrow">Выберите тему</div>
  <h1>Презентации</h1>
  <p class="sub">Две работы · один автор</p>

  <div class="grid">
    <a href="grammar.html" class="card grammar">
      <div class="icon">
        <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 12 L 50 14 L 46 52 L 18 50 Z"/>
          <path d="M22 24 H 42 M22 32 H 44 M22 40 H 40"/>
          <path d="M50 14 C 58 18 58 26 52 30" opacity=".5"/>
        </svg>
      </div>
      <h2>Present Simple<br>&amp; Present Continuous</h2>
      <p>Английская грамматика · 8 слайдов</p>
      <span class="btn">Открыть →</span>
    </a>

    <a href="misha.html" class="card misha">
      <div class="icon">
        <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 14 Q 32 10 50 14 L 50 50 Q 32 46 14 50 Z"/>
          <path d="M32 14 V 50"/>
          <path d="M20 26 H 28 M20 34 H 28 M36 26 H 44 M36 34 H 44"/>
        </svg>
      </div>
      <h2>Миша Ласкин</h2>
      <p>Рассказ Бориса Екимова · 8 слайдов</p>
      <span class="btn">Открыть →</span>
    </a>
  </div>

  <footer>© 2026 · Ионцев Михаил</footer>
</div>
</body>
</html>
